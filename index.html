<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduDesk - Student Management</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#121b2e;--mut:#6b7690;--line:#e4e8f0;--nav:#101a30;--acc:#12b5a2;--acc2:#0d8f80;--amb:#f2a93b;--red:#e5484d;--r:14px}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* Login */
#login{min-height:100vh;display:grid;place-items:center;background:var(--nav);position:relative;overflow:hidden;padding:20px}
.blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;animation:float 12s ease-in-out infinite alternate}
.b1{width:420px;height:420px;background:var(--acc);top:-120px;left:-100px}
.b2{width:360px;height:360px;background:#3a4fd7;bottom:-120px;right:-80px;animation-delay:-4s}
.b3{width:240px;height:240px;background:var(--amb);top:55%;left:55%;opacity:.3;animation-delay:-8s}
@keyframes float{to{transform:translate(60px,40px) scale(1.15)}}
.lcard{position:relative;width:100%;max-width:400px;background:rgba(255,255,255,.96);border-radius:22px;padding:36px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:rise .7s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.97)}}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;margin-bottom:6px}
.logo i{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#3a4fd7);display:grid;place-items:center;color:#fff;font-style:normal;font-size:18px}
.lcard p{color:var(--mut);margin-bottom:22px}
label{display:block;font-weight:600;font-size:12.5px;margin:0 0 6px;color:#3b455c}
input,select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;margin-bottom:14px;transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 4px rgba(18,181,162,.14);outline:0}
.btn{padding:11px 18px;border-radius:10px;font-weight:700;background:var(--acc);color:#fff;transition:transform .15s,background .2s,box-shadow .2s}
.btn:hover{background:var(--acc2);transform:translateY(-1px);box-shadow:0 8px 20px rgba(18,181,162,.35)}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--bg);box-shadow:none}
.link{background:none;color:var(--acc2);font-weight:600;margin-top:14px;width:100%}
#lmsg{color:var(--red);font-size:13px;margin-bottom:10px;min-height:16px}

.sg{display:none}.sg.on{display:block}
.av{width:38px;height:38px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--acc),#3a4fd7);color:#fff;display:inline-grid;place-items:center;font-weight:700;font-size:13px;vertical-align:middle;margin-right:10px}
.pv{display:flex;align-items:center;gap:14px;margin-bottom:14px}.pv .av{width:64px;height:64px;margin:0;font-size:20px}.pv input{margin:0;padding:8px}
.role{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(255,255,255,.14);color:#fff;text-transform:capitalize;display:inline-block;margin-bottom:6px;font-weight:700}
/* Layout */
#app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--nav);color:#c9d2e8;padding:22px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column}
aside .logo{color:#fff;padding:0 8px 22px}
nav{flex:1}
nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;color:inherit;text-decoration:none;font-weight:600;margin-bottom:3px;cursor:pointer;position:relative;transition:background .2s,color .2s,padding .2s}
nav a:hover{background:rgba(255,255,255,.07);padding-left:18px}
nav a.on{background:linear-gradient(90deg,rgba(18,181,162,.28),rgba(18,181,162,.06));color:#fff}
nav a.on::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--acc)}
.who{font-size:12px;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);word-break:break-all}
.who button{margin-top:8px;background:rgba(255,255,255,.1);color:#fff;padding:8px 12px;border-radius:8px;width:100%;font-weight:600}
main{padding:26px 30px;min-width:0}
header{display:flex;align-items:center;gap:12px;margin-bottom:24px;flex-wrap:wrap}
header h1{font-size:26px;font-weight:800;letter-spacing:-.5px;flex:1}
#menu{display:none;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:18px}
#q{width:240px;margin:0}

/* Dashboard */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:20px}
.stat{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line);position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(16,26,48,.1)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:100px;height:100px;border-radius:50%;background:var(--c,var(--acc));opacity:.12}
.stat small{color:var(--mut);font-weight:600}
.stat b{display:block;font-size:32px;font-weight:800;margin-top:6px;letter-spacing:-1px}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.panel{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:22px}
.panel h3{font-size:16px;margin-bottom:16px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar span{width:90px;font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar div{flex:1;height:12px;background:var(--bg);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,var(--acc),#3a4fd7);transition:width 1s cubic-bezier(.2,.8,.2,1)}
.bar em{font-style:normal;font-weight:700;width:28px;text-align:right}
.note{padding:12px 0;border-bottom:1px solid var(--line)}
.note:last-child{border:0}
.note small{color:var(--mut)}
.ring{--p:0;width:130px;height:130px;border-radius:50%;margin:6px auto 12px;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p)*1%),var(--bg) 0);transition:--p 1s}
.ring b{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:24px;font-weight:800}

/* Table */
.tw{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:14px 16px;font-size:12.5px;color:var(--mut);background:#fafbfd;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr{animation:in .4s both;transition:background .2s}
tbody tr:hover{background:#f7fafc}
@keyframes in{from{opacity:0;transform:translateX(-10px)}}
.tag{padding:4px 11px;border-radius:20px;font-size:12px;font-weight:700;background:#e8edf5;color:#3b455c}
.tag.g{background:#dff7f2;color:#0a7d6f}.tag.r{background:#fde6e7;color:#c2272d}.tag.a{background:#fdf0d8;color:#a8690a}
.act button{background:var(--bg);padding:7px 11px;border-radius:8px;margin-right:6px;font-weight:600;transition:background .2s}
.act button:hover{background:#dde3ee}.act .del:hover{background:#fde6e7;color:var(--red)}
.empty{padding:50px;text-align:center;color:var(--mut)}
.load{height:4px;border-radius:4px;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:200%;animation:ld 1s linear infinite}
@keyframes ld{to{background-position:-200%}}

/* Modal + toast */
#modal{position:fixed;inset:0;background:rgba(16,26,48,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .2s}
#mb{background:#fff;border-radius:20px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:28px;animation:pop .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(14px)}}
#mb h2{margin-bottom:18px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.fg .w{grid-column:1/-1}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;bottom:24px;right:24px;background:var(--nav);color:#fff;padding:13px 20px;border-radius:12px;font-weight:600;z-index:30;transform:translateY(90px);opacity:0;transition:.35s}
#toast.show{transform:none;opacity:1}#toast.bad{background:var(--red)}

@media(max-width:860px){
 #app{grid-template-columns:1fr}
 aside{position:fixed;z-index:15;width:260px;transform:translateX(-100%);transition:transform .3s}
 aside.open{transform:none}
 #menu{display:block}main{padding:18px}.two{grid-template-columns:1fr}#q{width:100%}.fg{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="login">
 <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
 <form class="lcard" id="lf">
  <div class="logo"><i>E</i>EduDesk</div>
  <p>Sign in to manage students, results, fees and more.</p>
  <div class="sg" id="sgf"><label for="fn">Full name</label><input id="fn"><label for="rl">Account type</label><select id="rl"><option value="teacher">Teacher</option><option value="student">Student</option><option value="parent">Parent</option></select><div id="rnw" hidden><label for="rn" id="rnl">Your roll no</label><input id="rn"></div></div>
  <label for="em">Email</label><input id="em" type="email" required autocomplete="email">
  <label for="pw">Password</label><input id="pw" type="password" required minlength="6" autocomplete="current-password">
  <div id="lmsg"></div>
  <button class="btn full" id="lbtn">Sign in</button>
  <button type="button" class="link" id="su">Create a new account</button>
 </form>
</div>

<div id="app" hidden>
 <aside id="side">
  <div class="logo"><i>E</i>EduDesk</div>
  <nav id="nav"></nav>
  <div class="who"><span id="uem"></span><button id="out">Sign out</button></div>
 </aside>
 <main>
  <header>
   <button id="menu" aria-label="Menu">&#9776;</button>
   <h1 id="ttl"></h1>
   <input id="q" placeholder="Search records" hidden>
   <button class="btn" id="add" hidden>Add new</button>
  </header>
  <section id="view"></section>
 </main>
</div>

<div id="modal" hidden><div id="mb"></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== 1) PUT YOUR SUPABASE DETAILS HERE ====== */
const SUPABASE_URL = "https://vfhvrohkzlqbhiyzyogg.supabase.co";
const SUPABASE_KEY = "sb_publishable_1Hi6FAPYPI5NZ3vXrBOdTw_IW6lb27m";
/* ================================================ */

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const F = (k, l, t = 'text', o) => ({k, l, t, o, w: t === 'textarea' || t === 'photo'});
const ACT = ['Active', 'Inactive'];

const M = {
 students:{t:'Students',f:[F('photo_url','Photo','photo'),F('roll_no','Roll no'),F('full_name','Full name'),F('gender','Gender','select',['Male','Female','Other']),F('class_name','Class'),F('dob','Date of birth','date'),F('phone','Phone'),F('parent_name','Parent name'),F('status','Status','select',ACT),F('address','Address','textarea')],show:['roll_no','full_name','class_name','phone','status']},
 teachers:{t:'Teachers',f:[F('photo_url','Photo','photo'),F('full_name','Full name'),F('subject','Subject'),F('phone','Phone'),F('email','Email','email'),F('joined','Joining date','date'),F('status','Status','select',ACT)],show:['full_name','subject','phone','status']},
 classes:{t:'Classes',f:[F('name','Class name'),F('section','Section'),F('teacher','Class teacher'),F('room','Room')],show:['name','section','teacher','room']},
 attendance:{t:'Attendance',f:[F('student_id','Student','ref'),F('date','Date','date'),F('status','Status','select',['Present','Absent','Late','Leave'])],show:['student_id','date','status']},
 results:{t:'Exams & Results',f:[F('student_id','Student','ref'),F('exam','Exam'),F('subject','Subject'),F('marks','Marks obtained','number'),F('total','Total marks','number')],show:['student_id','exam','subject','marks','total'],
  x:[['Grade',r=>{const p=r.marks/r.total*100;return `<span class="tag ${p>=40?'g':'r'}">${p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=40?'D':'F'} (${p.toFixed(0)}%)</span>`}]]},
 fees:{t:'Fees',f:[F('student_id','Student','ref'),F('month','Month'),F('amount','Amount','number'),F('paid','Paid','number'),F('status','Status','select',['Paid','Partial','Unpaid'])],show:['student_id','month','amount','paid','status'],
  x:[['Balance',r=>esc((r.amount||0)-(r.paid||0))]]},
 assignments:{t:'Assignments',f:[F('class_name','Class'),F('subject','Subject'),F('title','Title'),F('due','Due date','date'),F('details','Details','textarea')],show:['class_name','subject','title','due']},
 timetable:{t:'Timetable',f:[F('class_name','Class'),F('day','Day','select',['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']),F('period','Period'),F('time','Time'),F('subject','Subject'),F('teacher','Teacher')],show:['class_name','day','period','time','subject','teacher']},
 notices:{t:'Notices',f:[F('title','Title'),F('audience','Audience','select',['All','Students','Teachers','Parents']),F('date','Date','date'),F('message','Message','textarea')],show:['title','audience','date']},
 profiles:{t:'Users',admin:true,noAdd:true,noDel:true,f:[F('full_name','Full name'),{...F('email','Email'),ro:true},F('role','Role','select',['admin','teacher','student','parent']),{...F('student_id','Linked student','ref'),opt:true},F('approved','Approved','bool')],show:['full_name','email','role','student_id','approved']}
};

let cur = 'dashboard', rows = [], ref = {}, editId = null;

/* ---------- Icons ---------- */
const P = {
 dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
 students:'<path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c3 2 9 2 12 0v-5"/>',
 teachers:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 classes:'<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/>',
 attendance:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18M9 15l2 2 4-4"/>',
 results:'<circle cx="12" cy="9" r="6"/><path d="M8.5 14.5 7 22l5-3 5 3-1.5-7.5"/>',
 fees:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M6 15h4"/>',
 assignments:'<path d="M2 4h7a3 3 0 0 1 3 3v14a2 2 0 0 0-2-2H2z"/><path d="M22 4h-7a3 3 0 0 0-3 3v14a2 2 0 0 1 2-2h8z"/>',
 timetable:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 notices:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/>',
 profiles:'<path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="m9 12 2 2 4-4"/>'
};
const ic = k => `<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${P[k]||''}</svg>`;
const av = r => r.photo_url ? `<img class="av" src="${esc(r.photo_url)}" alt="">` : `<span class="av">${esc((r.full_name||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}</span>`;

/* ---------- Auth ---------- */
let signup = false, me = null;
const canEdit = () => !!me && ['admin','teacher'].includes(me.role);
const T = k => k === 'dashboard' ? 'Dashboard' : (!canEdit() && k === 'students') ? 'My profile' : M[k].t;
const note = (t, ok) => { const e = $('#lmsg'); e.style.color = ok ? '#0a7d6f' : ''; e.textContent = t; };
const rnSync = () => { const r = $('#rl').value; $('#rnw').hidden = r === 'teacher'; $('#rn').required = signup && r !== 'teacher'; $('#rnl').textContent = r === 'parent' ? "Your child's roll no" : 'Your roll no'; };
$('#rl').onchange = rnSync;
$('#su').onclick = () => {
 signup = !signup; $('#sgf').classList.toggle('on', signup); $('#fn').required = signup;
 $('#lbtn').textContent = signup ? 'Create account' : 'Sign in';
 $('#su').textContent = signup ? 'I already have an account' : 'Create a new account';
 $('#pw').autocomplete = signup ? 'new-password' : 'current-password'; note(''); rnSync();
};
$('#lf').onsubmit = async e => {
 e.preventDefault(); note('');
 const a = {email: $('#em').value, password: $('#pw').value};
 if (signup) a.options = {data: {full_name: $('#fn').value.trim(), role: $('#rl').value, roll_no: $('#rl').value === 'teacher' ? '' : $('#rn').value.trim()}};
 const {error} = signup ? await sb.auth.signUp(a) : await sb.auth.signInWithPassword(a);
 if (error) return note(error.message);
 if (signup) { await sb.auth.signOut(); return note('Account created. You can sign in after the admin approves it (confirm your email first if asked).', true); }
 start();
};
$('#out').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function start() {
 const {data:{session}} = await sb.auth.getSession();
 if (!session) return;
 const {data:p} = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
 if (!p || !p.approved) { await sb.auth.signOut(); return note('Your account is waiting for admin approval.', true); }
 me = p; $('#login').hidden = true; $('#app').hidden = false;
 $('#uem').innerHTML = `<span class="role">${esc(me.role)}</span><br>${esc(session.user.email)}`;
 const keys = canEdit() ? ['dashboard', ...Object.keys(M).filter(k => !M[k].admin || me.role === 'admin')]
  : Object.keys(M).filter(k => !M[k].admin && !['teachers','classes'].includes(k));
 $('#nav').innerHTML = keys.map(k => `<a data-k="${k}">${ic(k)}${T(k)}</a>`).join('');
 document.querySelectorAll('nav a').forEach(a => a.onclick = () => go(a.dataset.k));
 go(keys[0]);
}

/* ---------- Navigation ---------- */
async function go(k) {
 cur = k;
 document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.k === k));
 $('#side').classList.remove('open'); $('#q').value = '';
 const d = k === 'dashboard';
 $('#ttl').textContent = T(k);
 $('#add').hidden = d || !canEdit() || !!M[k].noAdd; $('#q').hidden = d;
 $('#view').innerHTML = '<div class="load"></div>';
 d ? dash() : list();
}
$('#menu').onclick = () => $('#side').classList.toggle('open');
$('#add').onclick = () => openForm();
$('#q').oninput = draw;

/* ---------- Dashboard ---------- */
async function dash() {
 const cnt = t => sb.from(t).select('*', {count:'exact', head:true});
 const today = new Date().toISOString().slice(0,10);
 const [s,t,c,fe,at,cl,nt] = await Promise.all([cnt('students'),cnt('teachers'),cnt('classes'),
  sb.from('fees').select('paid'), sb.from('attendance').select('status').eq('date',today),
  sb.from('students').select('class_name'), sb.from('notices').select('*').order('created_at',{ascending:false}).limit(4)]);
 if (s.error) return err(s.error);
 const fees = (fe.data||[]).reduce((a,r)=>a+(+r.paid||0),0);
 const att = at.data||[], pr = att.filter(r=>r.status==='Present').length;
 const pct = att.length ? Math.round(pr/att.length*100) : 0;
 const per = {}; (cl.data||[]).forEach(r => { const k = r.class_name || 'No class'; per[k] = (per[k]||0)+1; });
 const mx = Math.max(1, ...Object.values(per));
 const card = (l,n,c) => `<div class="stat" style="--c:${c}"><small>${l}</small><b data-n="${n}">0</b></div>`;
 $('#view').innerHTML = `
  <div class="grid">${card('Students',s.count||0,'#12b5a2')}${card('Teachers',t.count||0,'#3a4fd7')}${card('Classes',c.count||0,'#f2a93b')}${card('Fees collected',fees,'#e5484d')}</div>
  <div class="two">
   <div class="panel"><h3>Students per class</h3>${Object.entries(per).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div><i data-w="${v/mx*100}"></i></div><em>${v}</em></div>`).join('') || '<p class="empty">Add students to see this chart.</p>'}</div>
   <div class="panel"><h3>Today's attendance</h3><div class="ring" id="ring"><b>${pct}%</b></div><p style="text-align:center;color:var(--mut)">${pr} present of ${att.length} marked</p>
    <h3 style="margin-top:22px">Latest notices</h3>${(nt.data||[]).map(n=>`<div class="note"><b>${esc(n.title)}</b><br><small>${esc(n.audience)} · ${esc(n.date)}</small></div>`).join('') || '<p style="color:var(--mut)">No notices yet.</p>'}</div>
  </div>`;
 document.querySelectorAll('[data-n]').forEach(el => { const n = +el.dataset.n, t0 = performance.now();
  (function f(t){ const p = Math.min(1,(t-t0)/900); el.textContent = Math.round(n*(1-Math.pow(1-p,3))).toLocaleString(); if(p<1) requestAnimationFrame(f); })(t0); });
 setTimeout(() => document.querySelectorAll('[data-w]').forEach(b => b.style.width = b.dataset.w + '%'), 80);
}

/* ---------- Lists ---------- */
async function loadRef() {
 const {data} = await sb.from('students').select('id,full_name,roll_no').order('full_name');
 ref = {}; (data||[]).forEach(s => ref[s.id] = s.full_name + (s.roll_no ? ' (' + s.roll_no + ')' : ''));
}
async function list() {
 const m = M[cur]; await loadRef();
 const {data, error} = await sb.from(cur).select('*').order('created_at', {ascending:false});
 if (error) return err(error);
 rows = data; draw();
}
function cell(f, r) {
 const v = r[f.k];
 if (f.k === 'full_name' && 'photo_url' in r) return av(r) + esc(v);
 if (f.t === 'ref') return esc(ref[v] || '-');
 if (f.t === 'bool') return `<span class="tag ${v ? 'g' : 'a'}">${v ? 'Approved' : 'Pending'}</span>`;
 if (f.k === 'status') { const c = /Paid|Present|Active/.test(v) && v !== 'Unpaid' ? 'g' : /Absent|Unpaid|Inactive/.test(v) ? 'r' : 'a'; return `<span class="tag ${c}">${esc(v)}</span>`; }
 return esc(v ?? '-');
}
function draw() {
 const m = M[cur], q = $('#q').value.toLowerCase(), ed = canEdit();
 const rs = rows.filter(r => (Object.values(r).join(' ') + ' ' + (ref[r.student_id]||'')).toLowerCase().includes(q));
 const cols = m.show.map(k => m.f.find(f => f.k === k));
 if (!rs.length) return $('#view').innerHTML = `<div class="tw"><div class="empty">No records found.${ed && !m.noAdd ? '<br>Select <b>Add new</b> to create one.' : ''}</div></div>`;
 const btns = r => `<td class="act"><button onclick="openForm('${r.id}')">Edit</button>${m.noDel ? '' : `<button class="del" onclick="del('${r.id}')">Delete</button>`}</td>`;
 $('#view').innerHTML = `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c.l}</th>`).join('')}${(m.x||[]).map(x=>`<th>${x[0]}</th>`).join('')}${ed ? '<th></th>' : ''}</tr></thead><tbody>
  ${rs.map((r,i) => `<tr style="animation-delay:${Math.min(i,12)*30}ms">${cols.map(c=>`<td>${cell(c,r)}</td>`).join('')}${(m.x||[]).map(x=>`<td>${x[1](r)}</td>`).join('')}${ed ? btns(r) : ''}</tr>`).join('')}</tbody></table></div>`;
}

/* ---------- Form ---------- */
function openForm(id) {
 const m = M[cur], r = rows.find(x => x.id === id) || {}; editId = id || null;
 const inp = f => {
  const v = r[f.k] ?? (f.k === 'date' && !id ? new Date().toISOString().slice(0,10) : '');
  let h;
  if (f.t === 'textarea') h = `<textarea name="${f.k}" rows="3">${esc(v)}</textarea>`;
  else if (f.t === 'photo') h = `<div class="pv">${av(r)}<input name="${f.k}" type="file" accept="image/*"></div>`;
  else if (f.t === 'bool') h = `<select name="${f.k}"><option value="true" ${v===true?'selected':''}>Yes</option><option value="false" ${v!==true?'selected':''}>No</option></select>`;
  else if (f.t === 'select') h = `<select name="${f.k}">${f.o.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select>`;
  else if (f.t === 'ref') h = `<select name="${f.k}" ${f.opt?'':'required'}><option value="">${f.opt?'None':'Select student'}</option>${Object.entries(ref).map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${esc(n)}</option>`).join('')}</select>`;
  else h = `<input name="${f.k}" type="${f.t}" value="${esc(v)}" ${f.t==='number'?'step="any"':''} ${f.ro?'readonly':''}>`;
  return `<div class="${f.w?'w':''}"><label>${f.l}</label>${h}</div>`;
 };
 $('#mb').innerHTML = `<h2>${id?'Edit':'Add'} ${m.t.replace(/s$/,'').toLowerCase()}</h2><form id="ff"><div class="fg">${m.f.map(inp).join('')}</div>
  <div class="mf"><button type="button" class="btn ghost" onclick="closeForm()">Cancel</button><button class="btn">Save</button></div></form>`;
 $('#modal').hidden = false;
 $('#ff').onsubmit = save;
}
function closeForm() { $('#modal').hidden = true; }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeForm(); };
document.onkeydown = e => { if (e.key === 'Escape') closeForm(); };

async function save(e) {
 e.preventDefault();
 const btn = e.target.querySelector('.btn:not(.ghost)'); btn.disabled = true;
 const fd = new FormData(e.target), body = {}, old = rows.find(x => x.id === editId) || {};
 const fail = m => { btn.disabled = false; toast(m, true); };
 for (const f of M[cur].f) {
  let v = fd.get(f.k);
  if (f.t === 'photo') {
   if (v && v.size) {
    if (v.size > 2e6) return fail('Photo must be under 2 MB');
    const path = `${cur}/${crypto.randomUUID()}.${(v.name.split('.').pop() || 'jpg').toLowerCase()}`;
    const up = await sb.storage.from('photos').upload(path, v, {contentType: v.type});
    if (up.error) return fail(up.error.message);
    v = sb.storage.from('photos').getPublicUrl(path).data.publicUrl;
   } else v = old.photo_url || null;
  } else if (v === '' || v === null) v = null;
  else if (f.t === 'number') v = +v;
  else if (f.t === 'bool') v = v === 'true';
  body[f.k] = v;
 }
 const {error} = editId ? await sb.from(cur).update(body).eq('id', editId) : await sb.from(cur).insert(body);
 if (error) return fail(error.message);
 closeForm(); toast('Saved'); list();
}
async function del(id) {
 if (!confirm('Delete this record? This cannot be undone.')) return;
 const {error} = await sb.from(cur).delete().eq('id', id);
 if (error) return err(error);
 toast('Deleted'); list();
}

/* ---------- Helpers ---------- */
function toast(t, bad) { const el = $('#toast'); el.textContent = t; el.className = 'show' + (bad ? ' bad' : ''); clearTimeout(el.t); el.t = setTimeout(() => el.className = '', 2600); }
function err(e) { toast(e.message || 'Something went wrong', true); $('#view').innerHTML = `<div class="tw"><div class="empty">${esc(e.message)}<br>Check that schema.sql was run and your Supabase URL and key are correct.</div></div>`; }

start();
</script>
</body>
